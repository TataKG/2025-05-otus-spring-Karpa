<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">Вход - Кулинарная книга</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card-header {
            border-radius: 15px 15px 0 0 !important;
            border: none;
        }
        .test-users {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card login-card">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h4 class="mb-0" th:text="#{login.title}">🔑 Вход в систему</h4>
                </div>
                <div class="card-body p-5">
                    <form th:action="@{/login}" method="post">
                        <!-- Сообщение об успешной регистрации -->
                        <div th:if="${param.registered}" class="alert alert-success alert-dismissible fade show">
                            ✅ <span th:text="#{registration.success}">Регистрация прошла успешно! Теперь вы можете войти в систему.</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Сообщение об ошибке входа -->
                        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show">
                            ❌ <span th:text="#{login.error}">Неверное имя пользователя или пароль</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Сообщение о выходе -->
                        <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show">
                            ✅ <span th:text="#{login.logout_success}">Вы успешно вышли из системы</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Поле имени пользователя -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold" th:text="#{login.username}">
                                👤 Имя пользователя
                            </label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username"
                                   required th:placeholder="#{login.username.placeholder}">
                        </div>

                        <!-- Поле пароля -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold" th:text="#{login.password}">
                                🔒 Пароль
                            </label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password"
                                   required th:placeholder="#{login.password.placeholder}">
                        </div>

                        <!-- Кнопка входа -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                                🚀 <span th:text="#{login.button}">Войти</span>
                            </button>
                        </div>
                    </form>

                    <!-- Ссылка на регистрацию -->
                    <div class="mt-4 pt-3 border-top text-center">
                        <p class="text-muted mb-2">
                            <span th:text="#{login.no_account}">Нет аккаунта?</span>
                            <a th:href="@{/register}" class="text-decoration-none fw-semibold ms-1">
                                <span th:text="#{login.register_link}">Зарегистрироваться</span>
                            </a>
                        </p>
                    </div>

                    <!-- Тестовые пользователи (только для разработки) -->
                    <div class="mt-4 pt-3 border-top">
                        <div class="test-users">
                            <p class="text-center mb-2 text-muted small" th:text="#{login.test_users}">
                                Тестовые пользователи:
                            </p>
                            <div class="text-center">
                                <small class="text-muted">
                                    <strong>admin</strong> / admin123<br>
                                    <strong>user1</strong> / user123
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
