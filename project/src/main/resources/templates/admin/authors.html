<!DOCTYPE html>
<html th:replace="~{admin/admin-layout :: layout(
    pageTitle='admin.authors.title',
    pageSubtitle='admin.authors.subtitle'
)}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{admin.authors.title} + ' - ' + #{page.title}">Управление авторами - Кулинарная книга</title>
</head>
<body>
<!-- Контент страницы -->
<div th:fragment="content">
    <div class="row">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center py-5">
                    <div class="fs-1 mb-3">👥</div>
                    <h3 class="text-primary mb-3" th:text="#{admin.authors.title}">Управление авторами</h3>
                    <p class="text-muted mb-4" th:text="#{admin.authors.development_message}">
                        Функциональность управления авторами находится в разработке.<br>
                        Скоро здесь появится возможность просматривать и управлять авторами рецептов.
                    </p>
                    <div class="alert alert-info">
                        <strong th:text="#{common.info}">Информация:</strong>
                        <span th:text="#{admin.authors.features}">Просмотр авторов, редактирование биографий, управление правами.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальные окна (пока пустые) -->
<div th:fragment="modals">
    <!-- Модальные окна для авторов будут добавлены позже -->
</div>

<!-- Скрипты (пока пустые) -->
<div th:fragment="scripts">
    <!-- Скрипты для авторов будут добавлены позже -->
</div>
</body>
</html>
