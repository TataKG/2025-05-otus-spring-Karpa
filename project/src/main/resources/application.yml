spring:
  # Настройки базы данных H2
  datasource:
    url: jdbc:h2:mem:cookbookdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:test-data.sql

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

  # Thymeleaf настройки
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # MessageSource настройки
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/

  output:
    ansi:
      enabled: always
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# Логирование
logging:
  level:
    org.springframework.jdbc.datasource.init: DEBUG
    org.hibernate.SQL: DEBUG
    ru.otus.hw: DEBUG

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true