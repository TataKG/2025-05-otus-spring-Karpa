    </div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        fetch('/api/v1/books')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(books => {
                const tbody = document.getElementById("book-table");

                const warning = document.getElementById("no-books-warning");

                if (books.length === 0) {
                    warning.style.display = 'block';
                    return;
                } else {
                    warning.style.display = 'none';
                }

                books.forEach(function (book) {
                    const row = document.createElement('tr');

                    // Название книги
                    const title = document.createElement('td');
                    title.textContent = book.title;
                    row.appendChild(title);

                    // Автор
                    const authorName = document.createElement('td');
                    authorName.textContent = book.author.fullName;
                    row.appendChild(authorName);

                    // Жанры
                    const genreName = document.createElement('td');
                    genreName.textContent = book.genre.name;
                    row.appendChild(genreName);

                    // Действия
                    const actionsCell = document.createElement('td');
                    actionsCell.className = 'comment-actions';

                    // Кнопка Browse
                    const browseLink = document.createElement('a');
                    browseLink.className = 'btn btn-info btn-sm';
                    browseLink.href = `/books/view/${book.id}`;
                    browseLink.textContent = 'Browse';
                    actionsCell.appendChild(browseLink);

                    // Кнопка Edit
                    const editLink = document.createElement('a');
                    editLink.className = 'btn btn-success btn-sm';
                    editLink.href = `/books/edit/${book.id}`;
                    editLink.textContent = 'Edit';
                    actionsCell.appendChild(editLink);

                    // Форма Delete
                    const deleteForm = document.createElement('form');
                    deleteForm.method = 'delete';
                    deleteForm.action = 'book-delete';

                    const bookIdInput = document.createElement('input');
                    bookIdInput.id = "book-id";
                    bookIdInput.name = 'bookId';
                    bookIdInput.type = 'hidden';
                    bookIdInput.value = book.id;
                    deleteForm.appendChild(bookIdInput);

                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'btn btn-danger btn-sm';
                    deleteButton.style.display = 'inline';
                    deleteButton.type = 'button';
                    deleteButton.textContent = 'Delete';
                    deleteButton.onclick = () => deleteBook(book.id);
                    deleteForm.appendChild(deleteButton);

                    actionsCell.appendChild(deleteForm);
                    row.appendChild(actionsCell);

                    tbody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error fetching books:', error);
                document.getElementById('no-books-warning').textContent =
                    'Error loading books';
                document.getElementById('no-books-warning').style.display = 'block';
            });
    });
</script>
