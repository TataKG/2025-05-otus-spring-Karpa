    <div class="container mt-4">
        <h1 th:text="${book?.id} ? 'Edit Book' : 'Add New Book'">Book Form</h1>

        <form id="bookForm">
            <input type="hidden" id="bookId" th:value="${book?.id}">

            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title"
                       th:value="${book?.title}" required>
            </div>

            <div class="mb-3">
                <label for="authorId" class="form-label">Author</label>
                <select class="form-control" id="authorId" required>
                    <option value="">Select Author</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="genreId" class="form-label">Genre</label>
                <select class="form-control" id="genreId" required>
                    <option value="">Select Genre</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">Save</button>
            <a th:href="@{/books}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

    <script>
        class BookEditApp {
            constructor() {
                this.bookId = document.getElementById('bookId').value;
                this.init();
            }

            async init() {
                await this.loadFormData();
                if (this.bookId) {
                    await this.loadBook();
                }
                this.setupEventListeners();
            }

            async loadFormData() {
                try {
                    const response = await fetch('/api/v1/books/form-data');
                    const data = await response.json();

                    this.renderSelect(data.authors, 'authorId');
                    this.renderSelect(data.genres, 'genreId');
                } catch (error) {
                    console.error('Error loading form data:', error);
                    this.showError('Error loading form data');
                }
            }

            async loadBook() {
                try {
                    const response = await fetch(`/api/v1/books/${this.bookId}`);
                    if (!response.ok) throw new Error('Book not found');

                    const book = await response.json();
                    this.fillForm(book);
                } catch (error) {
                    console.error('Error loading book:', error);
                    this.showError('Error loading book');
                }
            }

            fillForm(book) {
                document.getElementById('title').value = book.title || '';
                document.getElementById('authorId').value = book.author?.id || '';
                document.getElementById('genreId').value = book.genre?.id || '';
            }

            renderSelect(items, selectId) {
                const select = document.getElementById(selectId);
                items.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.name;
                    select.appendChild(option);
                });
            }

            setupEventListeners() {
                document.getElementById('bookForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.saveBook();
                });
            }

            async saveBook() {
                const bookData = this.getFormData();

                if (!this.validateForm(bookData)) {
                    this.showError('Please fill all fields');
                    return;
                }

                try {
                    const url = this.bookId ? `/api/v1/books/${this.bookId}` : '/api/v1/books';
                    const method = this.bookId ? 'PUT' : 'POST';

                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(bookData)
                    });

                    if (!response.ok) throw new Error('Save failed');

                    const savedBook = await response.json();
                    this.showSuccess(this.bookId ? 'Book updated successfully' : 'Book created successfully');

                    // Redirect after delay
                    setTimeout(() => {
                        window.location.href = '/book/list';
                    }, 1500);

                } catch (error) {
                    console.error('Error saving book:', error);
                    this.showError('Error saving book');
                }
            }

            getFormData() {
                return {
                    title: document.getElementById('title').value,
                    author: { id: document.getElementById('authorId').value },
                    genre: { id: document.getElementById('genreId').value }
                };
            }

            validateForm(data) {
                return data.title && data.author.id && data.genre.id;
            }

            showSuccess(message) {
                Swal.fire({
                    icon: 'success',
                    title: 'Success!',
                    text: message,
                    timer: 1500,
                    showConfirmButton: false
                });
            }

            showError(message) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error!',
                    text: message
                });
            }
        }

        // Initialize app when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new BookEditApp();
        });
    </script>
