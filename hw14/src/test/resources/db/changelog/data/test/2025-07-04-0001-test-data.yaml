databaseChangeLog:
  - changeSet:
      id: 2025-07-24-0001-test-authors-data
      author: tgkarpa
      context: test
      changes:
        - loadData:
            file: csv/test/2025-07-24-0001-authors.csv
            relativeToChangelogFile: true
            separator: ";"
            encoding: UTF-8
            tableName: authors
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: full_name
                  type: VARCHAR(255)

