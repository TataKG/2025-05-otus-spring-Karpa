spring:

  messages:
    baseName: messages
    encoding: UTF-8
    fallbackToSystemLocale: false

  mvc:
    hidden-method:
      filter:
        enabled: true
    favicon:
      enabled: false

  output:
    ansi:
      enabled: always

  data:
    mongodb:
      host: localhost
      port: 27017
      database: hw10
      auto-index-creation: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  thymeleaf:
    cache: false

  datasource:
    url: jdbc:h2:mem:maindb;
    username: sa
    driver-class-name: org.h2.Driver
    sql:
      init:
        mode: always
    h2:
      console:
        enabled: true
        path: /h2-console
    jpa:
      open-in-view: false
      generate-ddl: false
      hibernate:
        ddl-auto: none
      show-sql: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.H2Dialect
          format_sql: false

logging:
  level:
    root: OFF
    #Отключаем шумные пакеты
    org.springframework.boot.autoconfigure: OFF
    org.springframework.security: OFF


