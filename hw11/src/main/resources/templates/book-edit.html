<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${id} ? 'Edit Book' : 'Add Book'">Book Form</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-0">
        <a class="navbar-brand pt-0" href="#">Library</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="book-list.html" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="author-list.html" th:href="@{/authors}">Authors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="genre-list.html" th:href="@{/genres}">Genres</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header text-white">
                    <h2 class="card-title mb-0" id="formTitle">
                        <span th:text="${id} ? 'Edit Book' : 'Add New Book'">Book Form</span>
                    </h2>
                </div>
                <div class="card-body">
                    <form id="bookForm" novalidate>
                        <input type="hidden" id="id" th:value="${id}">

                        <!-- Title Field -->
                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">Book Title *</label>
                            <input type="text" class="form-control form-control-lg" id="title"
                                   placeholder="Enter book title" required maxlength="255">
                            <div class="error-message" id="titleError"></div>
                        </div>

                        <!-- Author Field -->
                        <div class="mb-3">
                            <label for="authorId" class="form-label fw-bold">Author *</label>
                            <select class="form-control" id="authorId" required>
                                <option value="">-- Select Author --</option>
                            </select>
                            <div class="error-message" id="authorError"></div>
                        </div>

                        <!-- Genre Field -->
                        <div class="mb-3">
                            <label for="genreId" class="form-label fw-bold">Genre *</label>
                            <select class="form-control" id="genreId" required>
                                <option value="">-- Select Genre --</option>
                            </select>
                            <div class="error-message" id="genreError"></div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2 mt-4 pt-3 border-top">
                            <button type="submit" class="btn btn-success btn-lg px-4" id="submitBtn">
                                <span id="submitText">
                                    <span th:text="${id} ? 'Update Book' : 'Create Book'">Save Book</span>
                                </span>
                                <div id="submitSpinner" class="spinner-border spinner-border-sm d-none ms-2"
                                     role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </button>

                            <a th:href="@{/books}" class="btn btn-secondary btn-lg px-4">
                                Back to List
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    class BookEditApp {
        constructor() {
            this.API_BASE = '/api/v1';
            this.id = document.getElementById('id').value;
            this.authors = [];
            this.genres = [];
            this.currentBook = null;
            this.init();
        }

        async init() {
            try {
                this.setLoading(true);

                // Загружаем авторов и жанры параллельно
                await Promise.all([
                    this.loadAuthors(),
                    this.loadGenres()
                ]);

                // Только после загрузки авторов и жанров загружаем данные книги
                if (this.id) {
                    await this.loadBookData();
                }

                this.setupEventListeners();
                this.updateUI();

            } catch (error) {
                console.error('Error during initialization:', error);
                this.showError('Failed to initialize form. Please refresh the page.');
            } finally {
                this.setLoading(false);
            }
        }

        async loadAuthors() {
            try {
                console.log('Loading authors from:', `${this.API_BASE}/authors`);
                const response = await fetch(`${this.API_BASE}/authors`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                this.authors = await response.json();
                console.log('Authors loaded:', this.authors);

                // Заполняем выпадающий список авторов
                this.populateSelect('authorId', this.authors, 'fullName');

            } catch (error) {
                console.error('Error loading authors:', error);
                throw error;
            }
        }

        async loadGenres() {
            try {
                console.log('Loading genres from:', `${this.API_BASE}/genres`);
                const response = await fetch(`${this.API_BASE}/genres`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                this.genres = await response.json();
                console.log('Genres loaded:', this.genres);

                // Заполняем выпадающий список жанров
                this.populateSelect('genreId', this.genres, 'name');

            } catch (error) {
                console.error('Error loading genres:', error);
                throw error;
            }
        }

        async loadBookData() {
            try {
                console.log('Loading book data from:', `${this.API_BASE}/books/${this.id}`);
                const response = await fetch(`${this.API_BASE}/books/${this.id}`);

                if (!response.ok) {
                    if (response.status === 404) {
                        this.showError('Book not found. Redirecting to list...');
                        setTimeout(() => window.location.href = '/books', 2000);
                        return;
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                this.currentBook = await response.json();
                console.log('Book data loaded:', this.currentBook);

                // Заполняем форму данными книги
                this.fillForm(this.currentBook);

            } catch (error) {
                console.error('Error loading book:', error);
                throw error;
            }
        }

        populateSelect(selectId, items, displayField) {
            const select = document.getElementById(selectId);
            // Сохраняем первый option ("-- Select --")
            const firstOption = select.options[0];
            select.innerHTML = '';
            select.appendChild(firstOption);

            items.forEach(item => {
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = item[displayField] || `Unknown (ID: ${item.id})`;
                option.setAttribute('data-full-data', JSON.stringify(item));
                select.appendChild(option);
            });
        }

        fillForm(bookDto) {
            console.log('Filling form with book data:', bookDto);

            // Заполняем название
            document.getElementById('title').value = bookDto.title || '';

            // Обрабатываем автора
            this.handleAuthorSelection(bookDto);

            // Обрабатываем жанр
            this.handleGenreSelection(bookDto);

            this.updateUI();
        }

        handleAuthorSelection(bookDto) {
            const authorSelect = document.getElementById('authorId');

            let authorId = null;

            // Определяем authorId из различных возможных структур
            if (bookDto.authorId) {
                authorId = bookDto.authorId;
            } else if (bookDto.author && bookDto.author.id) {
                authorId = bookDto.author.id;
            }

            if (authorId) {
                // Устанавливаем значение в select
                authorSelect.value = authorId;

                console.log('Set author to:', authorId);
            }
        }

        handleGenreSelection(bookDto) {
            const genreSelect = document.getElementById('genreId');

            let genreId = null;

            // Определяем genreId из различных возможных структур
            if (bookDto.genreId) {
                genreId = bookDto.genreId;
            } else if (bookDto.genre && bookDto.genre.id) {
                genreId = bookDto.genre.id;
            }

            if (genreId) {
                // Устанавливаем значение в select
                genreSelect.value = genreId;

                console.log('Set genre to:', genreId);
            }
        }

        setupEventListeners() {
            const form = document.getElementById('bookForm');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                this.handleSubmit();
            });

            // Валидация при изменении полей
            document.getElementById('authorId').addEventListener('change', () => {
                this.clearError('authorId');
            });

            document.getElementById('genreId').addEventListener('change', () => {
                this.clearError('genreId');
            });

            document.getElementById('title').addEventListener('input', () => {
                this.clearError('title');
            });
        }

        async handleSubmit() {
            if (!this.validateForm()) {
                return;
            }

            try {
                this.setSubmitState(true);

                const bookFormDto = this.getFormData();
                console.log('Submitting BookFormDto:', bookFormDto);

                const url = this.id ? `${this.API_BASE}/books/${this.id}` : `${this.API_BASE}/books`;
                const method = this.id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bookFormDto)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || `HTTP error! status: ${response.status}`);
                }

                const savedBookDto = await response.json();
                console.log('Book saved successfully:', savedBookDto);

                const successMessage = this.id ?
                    'Book updated successfully!' : 'Book created successfully!';

                this.showSuccess(successMessage, () => {
                    window.location.href = '/books';
                });

            } catch (error) {
                console.error('Error saving book:', error);
                this.showError('Failed to save book. Please check the data and try again.');
            } finally {
                this.setSubmitState(false);
            }
        }

        getFormData() {
            return {
                id: this.id || "",
                title: document.getElementById('title').value.trim(),
                authorId: document.getElementById('authorId').value,
                genreId: document.getElementById('genreId').value
            };
        }

        validateForm() {
            let isValid = true;
            const formData = this.getFormData();

            // Validate title
            if (!formData.title) {
                this.showFieldError('title', 'Book title is required');
                isValid = false;
            } else if (formData.title.length < 2) {
                this.showFieldError('title', 'Title must be at least 2 characters long');
                isValid = false;
            }

            // Validate author
            if (!formData.authorId) {
                this.showFieldError('authorId', 'Please select an author');
                isValid = false;
            }

            // Validate genre
            if (!formData.genreId) {
                this.showFieldError('genreId', 'Please select a genre');
                isValid = false;
            }

            return isValid;
        }

        showFieldError(fieldId, message) {
            const errorElement = document.getElementById(fieldId + 'Error');
            if (errorElement) {
                errorElement.textContent = message;
            }
            document.getElementById(fieldId).classList.add('is-invalid');
        }

        clearError(fieldId) {
            const errorElement = document.getElementById(fieldId + 'Error');
            if (errorElement) {
                errorElement.textContent = '';
            }
            document.getElementById(fieldId).classList.remove('is-invalid');
        }

        updateUI() {
            const titleElement = document.getElementById('formTitle');
            const mode = this.id ? 'Edit' : 'Add New';
            titleElement.innerHTML = `${mode} Book`;

            const submitText = document.getElementById('submitText');
            submitText.innerHTML = `${this.id ? 'Update' : 'Create'} Book`;
        }

        setLoading(loading) {
            const form = document.getElementById('bookForm');
            if (loading) {
                form.classList.add('loading');
            } else {
                form.classList.remove('loading');
            }
        }

        setSubmitState(submitting) {
            const submitBtn = document.getElementById('submitBtn');
            const submitSpinner = document.getElementById('submitSpinner');

            if (submitting) {
                submitBtn.disabled = true;
                submitSpinner.classList.remove('d-none');
            } else {
                submitBtn.disabled = false;
                submitSpinner.classList.add('d-none');
            }
        }

        showSuccess(message, callback) {
            Swal.fire({
                icon: 'success',
                title: 'Success!',
                text: message,
                timer: 2000,
                showConfirmButton: false
            }).then(callback);
        }

        showError(message) {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: message
            });
        }
    }

    // Initialize the application when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        window.app = new BookEditApp();
    });
</script>
</body>
</html>
